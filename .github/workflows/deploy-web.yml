name: Deploy Web

# Builds the web entry (Teams + Box on IndexedDB - see CLAUDE.md's "Web
# build" section) and publishes it to GitHub Pages at
# choicebuds.vannyproductions.com, on every push to main. Separate from
# release.yml, which builds the Electron desktop installers - this ships
# the static SPA instead.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4
